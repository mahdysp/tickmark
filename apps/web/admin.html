<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickMark – Admin</title>
    <style>
      input, select, textarea { padding: 0.5rem; margin: 0.2rem 0; font-size: 1rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; }
      td, th { padding: 0.35rem 0.4rem; text-align: left; }
      .err { color: #b00020; }
    </style>
  </head>
  <body style="font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem">
    <h1>TickMark – Admin</h1>

    <section id="login">
      <h2>Admin login</h2>
      <input id="uid" placeholder="university id" autocomplete="username" /><br />
      <input id="pw" type="password" placeholder="password" autocomplete="current-password" /><br />
      <button id="loginBtn">Log in</button>
      <p id="loginErr" class="err"></p>
    </section>

    <section id="app" hidden>
      <p>Signed in as <b id="who"></b> <button id="logout">Log out</button></p>

      <h2>1. Add a person</h2>
      <input id="pUid" placeholder="university id" />
      <input id="pName" placeholder="full name" />
      <select id="pRole">
        <option value="student">student</option>
        <option value="professor">professor</option>
        <option value="admin">admin</option>
      </select>
      <input id="pPw" type="password" placeholder="password (professor/admin, 8+ chars)" />
      <button id="pBtn">Add</button>
      <p id="pMsg"></p>

      <h2>2. Courses</h2>
      <input id="cCode" placeholder="course code" />
      <input id="cTitle" placeholder="title" />
      <select id="cProf"></select>
      <input id="cCap" type="number" min="0" placeholder="room capacity" style="width: 9rem" />
      <button id="cBtn">Create course</button>
      <p id="cMsg"></p>
      <ul id="courses"></ul>

      <div id="detail" hidden>
        <h2 id="detailTitle"></h2>

        <h3>Import students</h3>
        <p style="font-size: 0.9rem">One per line: <code>university id, full name</code> (no header row)</p>
        <textarea id="importText" rows="6" style="width: 100%" placeholder="40011111, Student One&#10;40022222, Student Two"></textarea>
        <button id="importBtn">Import and enroll</button>
        <p id="importMsg"></p>

        <h3>Students</h3>
        <button id="codesBtn">Generate codes for students without a device</button>
        <button id="csvBtn" hidden>Download codes (CSV)</button>
        <pre id="codesOut"></pre>
        <table style="width: 100%; border-collapse: collapse">
          <thead>
            <tr style="border-bottom: 2px solid #ccc">
              <th>ID</th><th>Name</th><th>Device</th><th>Pending code</th><th></th>
            </tr>
          </thead>
          <tbody id="studentRows"></tbody>
        </table>
      </div>
    </section>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
