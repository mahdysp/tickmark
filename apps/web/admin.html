<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickMark – Admin</title>
  </head>
  <body style="font-family: sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem">
    <h1>TickMark – Admin</h1>

    <section id="login">
      <input id="uid" placeholder="admin id" autocomplete="username" style="width: 100%; padding: 0.6rem; font-size: 1.1rem" />
      <input id="pw" type="password" placeholder="password" autocomplete="current-password" style="width: 100%; margin-top: 0.5rem; padding: 0.6rem; font-size: 1.1rem" />
      <button id="loginBtn" style="margin-top: 0.8rem; padding: 0.7rem 1.2rem; font-size: 1.1rem">Log in</button>
      <p id="loginErr" style="color: #b00020"></p>
    </section>

    <section id="app" hidden>
      <p>Signed in as <b id="who"></b> <button id="logout">Log out</button></p>

      <h2>Professors</h2>
      <div>
        <input id="pId" placeholder="university id" autocomplete="off" />
        <input id="pName" placeholder="full name" autocomplete="off" />
        <input id="pPw" type="password" placeholder="password (8+)" autocomplete="new-password" />
        <button id="addProf">Add professor</button>
      </div>
      <p id="profMsg"></p>
      <ul id="profs"></ul>

      <h2>Courses</h2>
      <div>
        <input id="cCode" placeholder="code" autocomplete="off" />
        <input id="cTitle" placeholder="title" autocomplete="off" />
        <select id="profSelect"></select>
        <input id="cCap" type="number" min="0" placeholder="room capacity" style="width: 9rem" />
        <button id="addCourse">Add course</button>
      </div>
      <p id="courseMsg"></p>
      <ul id="courses"></ul>

      <div id="manage" hidden>
        <h2 id="manageTitle"></h2>
        <textarea id="importText" rows="6" style="width: 100%" placeholder="40012345, Student Name&#10;40012346, Another Student"></textarea>
        <button id="importBtn">Import and enroll</button>
        <p id="importMsg"></p>
        <p id="codeMsg" style="font-weight: bold"></p>
        <table style="width: 100%; border-collapse: collapse">
          <thead>
            <tr style="text-align: left; border-bottom: 2px solid #ccc">
              <th>ID</th><th>Name</th><th>Device</th><th></th>
            </tr>
          </thead>
          <tbody id="students"></tbody>
        </table>
      </div>
    </section>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
