<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickMark – Dashboard</title>
  </head>
  <body style="font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem">
    <h1>TickMark – Live dashboard</h1>
    <input id="adminToken" placeholder="admin token" autocomplete="off" style="width: 100%; padding: 0.6rem" />
    <input id="sessionId" placeholder="session id (uuid)" autocomplete="off" style="width: 100%; margin-top: 0.5rem; padding: 0.6rem" />
    <button id="start" style="margin-top: 0.6rem; padding: 0.7rem 1.2rem; font-size: 1.1rem">Start</button>
    <h2 id="summary" style="font-size: 1.1rem"></h2>
    <p id="alert" style="color: #b00020; font-weight: bold"></p>
    <table style="width: 100%; border-collapse: collapse">
      <thead>
        <tr style="text-align: left; border-bottom: 2px solid #ccc">
          <th>ID</th><th>Name</th><th>Pulses</th><th>%</th><th>Offline records</th><th>Review</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
