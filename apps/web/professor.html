<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickMark – Professor</title>
  </head>
  <body style="font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem">
    <h1>TickMark – Professor</h1>
    <input id="shortId" placeholder="session shortId" autocomplete="off" style="width: 100%; padding: 0.6rem; font-size: 1.1rem" />
    <textarea id="key" placeholder="session key (base64)" autocomplete="off" style="width: 100%; margin-top: 0.6rem; padding: 0.6rem; font-size: 1rem"></textarea>
    <button id="start" style="margin-top: 0.8rem; padding: 0.9rem 1.4rem; font-size: 1.2rem">Start attendance pulse (45 s)</button>
    <pre id="status" style="white-space: pre-wrap"></pre>
    <script type="module" src="/src/professor.ts"></script>
  </body>
</html>
